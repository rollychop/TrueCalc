# PUBLIC signing key for the GitHub Releases build (package com.brohit.truecalc.github).
# Committed on purpose: anyone can sign APKs with it, so it must never sign the Play build.
# CI uses these unless SIGNING_* secrets are set (see .github/workflows/release.yml).
storeFile=keystore/truecalc-github.jks
storePassword=truecalc-github
keyAlias=truecalc-github
keyPassword=truecalc-github
